            mkdir -p /tmp/db
            set +o pipefail 2>/dev/null; seq 1 1050585 | awk 'BEGIN{ORS="\0"} 1' | tr '\0' 'z' > /tmp/db/dUStyRenDER; true
            md5sum /tmp/db/dUStyRenDER > /dev/null && echo "md5 ok"
      - persist_to_workspace:
