          command: |
            find /tmp/db/dUStyRenDER -type f 2>/dev/null | wc -l || true
      - run:
          name: Fetch sources tree
          command: git clone --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prime workspace
